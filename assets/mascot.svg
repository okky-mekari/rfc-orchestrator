<svg viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS','Trebuchet MS',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#2f5a4a"/>
      <stop offset="60%" stop-color="#17332b"/>
      <stop offset="100%" stop-color="#0b1a16"/>
    </radialGradient>
    <radialGradient id="portal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaffb0"/>
      <stop offset="35%" stop-color="#7dff45"/>
      <stop offset="70%" stop-color="#1faa2e"/>
      <stop offset="100%" stop-color="#0a5a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coals" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d8ff8a"/>
      <stop offset="45%" stop-color="#5ede2e"/>
      <stop offset="100%" stop-color="#0c6a12"/>
    </radialGradient>
    <filter id="wobble" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="900" height="780" fill="url(#bg)"/>

  <!-- everything hand-drawn gets the boil wobble -->
  <g filter="url(#wobble)" stroke="#0c0c0c" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== CAPE ===== -->
    <path d="M312 268 C210 320 214 500 268 650 C286 566 320 548 356 566 C332 470 340 356 372 306 Z" fill="#e0384c" stroke-width="6"/>
    <path d="M528 262 C640 305 664 500 626 655 C606 566 574 550 540 570 C556 470 534 356 500 306 Z" fill="#e0384c" stroke-width="6"/>

    <!-- ===== BODY jacket ===== -->
    <path d="M360 300 C360 262 540 262 540 300 L566 476 C558 508 342 508 334 476 Z" fill="#23232c" stroke-width="6"/>
    <path d="M450 280 L408 476 L492 476 Z" fill="#5a2178"/>
    <path d="M450 300 L436 430 L464 430 Z" fill="#e0384c"/>
    <g fill="#d8d8e2" stroke-width="2">
      <circle cx="384" cy="336" r="5"/><circle cx="384" cy="362" r="5"/><circle cx="384" cy="388" r="5"/>
      <circle cx="516" cy="336" r="5"/><circle cx="516" cy="362" r="5"/><circle cx="516" cy="388" r="5"/>
    </g>

    <!-- ===== RIGHT ARM (noodle) raised to portal ===== -->
    <path d="M538 320 C620 300 678 250 706 230" fill="none" stroke-width="20"/>
    <path d="M538 320 C620 300 678 250 706 230" fill="none" stroke="#e7ded2" stroke-width="14"/>
    <circle cx="710" cy="228" r="17" fill="#e7ded2" stroke-width="6"/>
    <path d="M704 214 v-16 M714 213 v-15 M722 218 v-13 M696 220 v-12" fill="none" stroke="#e7ded2" stroke-width="8"/>

    <!-- ===== LEFT ARM (noodle) with tongs ===== -->
    <path d="M364 322 C312 352 314 430 360 476" fill="none" stroke-width="20"/>
    <path d="M364 322 C312 352 314 430 360 476" fill="none" stroke="#e7ded2" stroke-width="14"/>
    <circle cx="364" cy="480" r="15" fill="#e7ded2" stroke-width="6"/>
    <path d="M374 476 L452 516 M374 490 L452 524" fill="none" stroke="#cfcfe0" stroke-width="6"/>
    <path d="M374 476 C362 482 362 490 374 490" fill="none" stroke="#cfcfe0" stroke-width="6"/>

    <!-- ===== HEAD ===== -->
    <rect x="430" y="248" width="40" height="30" rx="10" fill="#dcd2c2" stroke-width="6"/>
    <path d="M388 198 C388 138 512 138 512 198 C512 252 486 280 450 280 C414 280 388 252 388 198 Z" fill="#e7ded2" stroke-width="6"/>
    <!-- ears -->
    <circle cx="388" cy="206" r="12" fill="#e7ded2" stroke-width="6"/>
    <circle cx="512" cy="206" r="12" fill="#e7ded2" stroke-width="6"/>
    <circle cx="388" cy="209" r="4" fill="none" stroke-width="3"/>

    <!-- mohawk -->
    <g fill="#8fb0b8" stroke-width="6">
      <path d="M404 150 L416 78 L430 148 Z"/>
      <path d="M430 148 L446 62 L460 146 Z"/>
      <path d="M460 146 L476 72 L490 150 Z"/>
      <path d="M400 152 C398 138 470 136 500 152 L502 170 C470 160 420 162 402 166 Z"/>
    </g>
    <path d="M446 62 L452 106 L458 146" fill="none" stroke="#4a7a86" stroke-width="5"/>

    <!-- ===== BIG BUG EYES ===== -->
    <ellipse cx="430" cy="196" rx="30" ry="37" fill="#fff" stroke-width="6"/>
    <ellipse cx="474" cy="196" rx="30" ry="37" fill="#fff" stroke-width="6"/>
    <circle cx="424" cy="204" r="6.5" fill="#0c0c0c" stroke="none"/>
    <circle cx="480" cy="204" r="6.5" fill="#0c0c0c" stroke="none"/>
    <!-- eye bags -->
    <path d="M410 224 q18 10 34 2 M462 226 q18 8 34 -2" fill="none" stroke="#c9bfa8" stroke-width="3"/>
    <!-- one raised brow -->
    <path d="M406 158 q26 -8 46 4" fill="none" stroke="#0c0c0c" stroke-width="5"/>
    <path d="M456 168 q22 -4 42 6" fill="none" stroke="#0c0c0c" stroke-width="5"/>

    <!-- ===== OPEN DROOLING MOUTH ===== -->
    <path d="M424 248 q26 30 56 4 q-4 20 -28 22 q-24 -2 -28 -26 Z" fill="#2a0f14" stroke-width="6"/>
    <path d="M432 250 q22 6 42 -2 l-2 8 q-18 6 -38 0 Z" fill="#fff" stroke-width="2"/>
    <path d="M438 268 q14 10 30 0 q-2 12 -15 12 q-13 0 -15 -12 Z" fill="#e0637a" stroke-width="2"/>
    <!-- drool -->
    <path d="M470 274 q6 18 2 34 q-6 6 -8 -2 q-2 -18 0 -30 Z" fill="#cfeaff" stroke-width="3"/>
    <!-- goatee -->
    <path d="M436 288 C440 312 462 312 468 288 C463 302 441 302 436 288 Z" fill="#8fb0b8" stroke-width="5"/>

    <!-- sweat drop -->
    <path d="M356 176 q10 14 0 22 q-10 -8 0 -22 Z" fill="#bfe6ff" stroke-width="3"/>

    <!-- ===== GRILL ===== -->
    <g stroke-width="7">
      <line x1="362" y1="606" x2="322" y2="722" stroke="#1a1a20"/>
      <line x1="540" y1="606" x2="580" y2="722" stroke="#1a1a20"/>
      <line x1="450" y1="616" x2="450" y2="728" stroke="#1a1a20"/>
    </g>
    <path d="M300 566 A150 150 0 0 0 600 566 Z" fill="#2b2b33" stroke-width="7"/>
    <ellipse cx="450" cy="566" rx="150" ry="34" fill="#43434f" stroke-width="7"/>
    <ellipse cx="450" cy="566" rx="132" ry="26" fill="#141419" stroke="none"/>
    <ellipse cx="450" cy="568" rx="118" ry="20" fill="url(#coals)" stroke="none"/>
    <g stroke-width="4">
      <line x1="336" y1="558" x2="564" y2="558" stroke="#7a7a88"/>
      <line x1="332" y1="566" x2="568" y2="566" stroke="#7a7a88"/>
      <line x1="336" y1="574" x2="564" y2="574" stroke="#7a7a88"/>
    </g>

    <!-- portal flames off coals -->
    <g fill="none" stroke="#8dff5a" stroke-width="4">
      <path d="M406 550 q10 -18 0 -32 q-10 -12 0 -26"/>
      <path d="M450 546 q10 -18 0 -32 q-10 -12 0 -26"/>
      <path d="M494 550 q10 -18 0 -32 q-10 -12 0 -26"/>
    </g>

    <!-- ===== RFC on the grate ===== -->
    <g transform="translate(450,544) rotate(-8)">
      <rect x="-74" y="-42" width="148" height="84" rx="8" fill="#f4efe3" stroke-width="6"/>
      <g stroke="#3a2a1a" stroke-width="7" opacity="0.55">
        <line x1="-66" y1="-18" x2="66" y2="-18"/>
        <line x1="-66" y1="8" x2="66" y2="8"/>
        <line x1="-66" y1="30" x2="66" y2="30"/>
      </g>
      <text x="0" y="-6" text-anchor="middle" font-size="36" font-weight="800" fill="#c0243a" stroke="none" letter-spacing="2">RFC</text>
      <text x="0" y="18" text-anchor="middle" font-size="10" fill="#6a6154" stroke="none">PLAN_FINAL.md</text>
    </g>
  </g>

  <!-- ===== GREEN PORTAL (crisp, not wobbled) ===== -->
  <g transform="translate(712,226)">
    <circle r="108" fill="url(#portal)" filter="url(#glow)" opacity="0.7"/>
    <g fill="none" stroke="#0c0c0c" stroke-width="5">
      <circle r="86"/>
    </g>
    <g fill="none" stroke="#c9ff7a" stroke-width="4" opacity="0.95">
      <path d="M0 -70 A70 70 0 0 1 60 40 A60 60 0 0 0 -46 32 A48 48 0 0 1 20 -30 A34 34 0 0 0 -22 22"/>
    </g>
    <circle r="10" fill="#eaffb0" stroke="none"/>
  </g>
  <g fill="#8dff5a" stroke="#0c0c0c" stroke-width="2">
    <circle cx="716" cy="268" r="4"/><circle cx="724" cy="292" r="3"/>
  </g>

  <!-- title -->
  <text x="450" y="60" text-anchor="middle" font-size="36" font-weight="800" fill="#c9ff7a" stroke="#0c0c0c" stroke-width="1.5" letter-spacing="1">RFC ORCHESTRATOR</text>
  <text x="450" y="88" text-anchor="middle" font-size="15" fill="#a9f08a" letter-spacing="3">*BURP* GRILL THE PRD, SHIP THE PLAN</text>
</svg>
